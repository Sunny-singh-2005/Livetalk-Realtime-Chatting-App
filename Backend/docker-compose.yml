version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: livetalk-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: LiveTalk
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: livetalk-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: livetalk-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "61613:61613"   # STOMP (ChatService relay uses this)
      - "15672:15672"   # Management UI (guest/guest)
    command: >
      bash -c "rabbitmq-plugins enable rabbitmq_stomp && rabbitmq-server"

volumes:
  pg_data:
  mongo_data:
